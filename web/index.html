<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Schedule</title>

    <meta name="theme-color" content="#f8f8fa">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="/static/style.css">
    <style>
        .app {
            display: none;
        }
    </style>
</head>

<body>

<div id="jsError" style="display:none;padding:16px;font-family:sans-serif;color:#fff;background:#24181b;border-bottom:1px solid #5c2b31">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="width:10px;height:10px;border-radius:50%;background:#ff5f6d;box-shadow:0 0 10px #ff5f6d"></div>
        <strong style="font-size:17px">Помилка Mini App</strong>
    </div>
    <div style="font-size:13px;color:#ffb8bd;margin-bottom:12px">
        Під час роботи сталася JavaScript-помилка.
    </div>
    <div id="jsErrorText" style="padding:11px;border-radius:10px;background:#171113;color:#f4dfe1;font:12px/1.5 monospace;white-space:pre-wrap;overflow-wrap:anywhere"></div>
    <button id="copyJsLogButton" type="button" style="margin-top:12px;width:100%;min-height:44px;border:0;border-radius:10px;background:#229af0;color:#fff;font-size:14px;font-weight:600">
        Скопіювати діагностичний лог
    </button>
</div>

<div id="accessDenied" style="padding:24px;font-family:sans-serif;text-align:center">
    <h2>Перевірка доступу</h2>
    <p>Перевіряємо права адміністратора…</p>
</div>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="title">Schedule</div>

        <div id="todayDate"></div>
        <button id="copyJsLogHeaderButton" type="button">📋 Лог</button>


    </header>


    <!-- WEEK NAVIGATION -->
    <section class="week-navigation">

        <button id="prevWeek">‹</button>

        <div class="week-center"><span id="weekTitle"></span></div>

        <button id="nextWeek">›</button>

    </section>


    <!-- SCHEDULE -->
    <main>
        <div id="scheduleScreen">

        <section class="schedule-wrapper">

            <div class="table-scroll">

                <table class="schedule">

                    <thead>

                        <tr>
                            <th class="name-column">
                                Worker
                            </th>

                            <th id="scheduleDay0">Mon</th>

                            <th id="scheduleDay1">Tue</th>

                            <th id="scheduleDay2">Wed</th>

                            <th id="scheduleDay3">Thu</th>

                            <th id="scheduleDay4">Fri</th>

                            <th id="scheduleDay5">Sat</th>

                            <th id="scheduleDay6">Sun</th>

                            <th class="lunch-column">
                                Lunch
                            </th>
                        </tr>

                    </thead>

                    <tbody id="scheduleBody">

                    </tbody>

                </table>

            </div>

        </section>


        <button id="exportScheduleButton" class="add-worker-button">📤 Export</button>

<button id="generateScheduleButton" class="add-worker-button">
            ⚙️ Згенерувати розклад
        </button>

        <button id="clearScheduleButton" class="clear-schedule-button">
            🗑️ Очистити графік
        </button>



        <div id="exportModal" class="station-modal hidden">
            <div class="station-modal-box">
                <div class="station-modal-title">Export schedule</div>
                <div class="station-worker-list">
                    <button id="saveScheduleImageButton" class="station-choice-option">📥 Save image</button>
                    <button id="shareScheduleImageButton" class="station-choice-option">📤 Share image</button>
                    <button id="cancelExportButton" class="station-cancel-button">Cancel</button>
                </div>
            </div>
        </div>

        <div id="stationModal" class="station-modal hidden">
            <div class="station-modal-box">
                <div id="stationModalTitle" class="station-modal-title"></div>
                <div id="stationWorkerList" class="station-worker-list"></div>
                <button id="clearStationButton" class="station-clear-button">
                    Звільнити станцію
                </button>
                <button id="cancelStationButton" class="station-cancel-button">
                    Скасувати
                </button>
            </div>
        </div>
        </div>

        <div id="workersScreen" hidden></div>
        <div id="lunchScreen" hidden></div>
    </main>


    <!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
    <button class="active">
        <span>📅</span>
        <small>Розклад</small>
    </button>

    <button>
        <span>👥</span>
        <small>Працівники</small>
    </button>

    <button>
        <span>🍽</span>
        <small>Обіди</small>
    </button>
</nav>



<script src="/static/app.js?v=5"></script>

</body>
</html>
