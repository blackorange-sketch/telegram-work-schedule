<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Розклад</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="header-info">
            <div class="title">Розклад</div>
            <div class="week">
                6 — 10 жовтня 2026
            </div>
        </div>

        <button class="icon-button">
            👤
        </button>

    </header>


    <!-- WEEK NAVIGATION -->
    <section class="week-navigation">

        <button id="prevWeek">‹</button>

        <div class="week-center">
            <strong id="weekTitle">
                Поточний тиждень
            </strong>

            <span>
                Понеділок — П'ятниця
            </span>
        </div>

        <button id="nextWeek">›</button>

    </section>


    <!-- SCHEDULE -->
    <main>

        <section class="schedule-wrapper">

            <div class="table-scroll">

                <table class="schedule">

                    <thead>

                        <tr>
                            <th class="name-column">
                                Працівник
                            </th>

                            <th>
                                Пн
                            </th>

                            <th>
                                Вт
                            </th>

                            <th>
                                Ср
                            </th>

                            <th>
                                Чт
                            </th>

                            <th>
                                Пт
                            </th>

                            <th>Сб</th>

                            <th>Нд</th>

                            <th class="lunch-column">
                                Обід
                            </th>
                        </tr>

                    </thead>

                    <tbody id="scheduleBody">

                    </tbody>

                </table>

            </div>

        </section>


        <button id="generateScheduleButton" class="add-worker-button">
            ⚙️ Згенерувати розклад
        </button>

        <!-- RESERVE -->
        <section class="card">

            <div class="card-title">
                🔄 Резерв
            </div>

            <div class="reserve-list">

                <div class="reserve-person">
                    <span>Микола</span>
                    <small>Резерв 1</small>
                </div>

                <div class="reserve-person">
                    <span>Сергій</span>
                    <small>Резерв 2</small>
                </div>

            </div>

        </section>


        <!-- SHIFT -->
        <section class="card">

            <div class="card-title">
                🕐 Зміни
            </div>

            <div class="shift-list">

                <div class="shift">
                    <span class="shift-number shift-1">
                        1
                    </span>

                    <div>
                        <strong>1 зміна</strong>
                        <small>06:00 — 14:00</small>
                    </div>
                </div>

                <div class="shift">
                    <span class="shift-number shift-2">
                        2
                    </span>

                    <div>
                        <strong>2 зміна</strong>
                        <small>14:00 — 22:00</small>
                    </div>
                </div>

                <div class="shift">
                    <span class="shift-number shift-3">
                        3
                    </span>

                    <div>
                        <strong>3 зміна</strong>
                        <small>22:00 — 06:00</small>
                    </div>
                </div>

            </div>

        </section>

    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button class="active">
            <span>📅</span>
            <small>Розклад</small>
        </button>

        <button>
            <span>👥</span>
            <small>Працівники</small>
        </button>

        <button>
            <span>🍽</span>
            <small>Обіди</small>
        </button>

        <button>
            <span>⚙️</span>
            <small>Налаштування</small>
        </button>

    </nav>

</div>


<script src="/static/workers.js?v=2"></script>
<script src="/static/app.js?v=2"></script>

</body>
</html>
