<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Розклад</title>

    <meta name="theme-color" content="#f8f8fa">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="title">Розклад</div>

        <div class="week">
            6 — 10 жовтня 2026
        </div>

    </header>


    <!-- WEEK NAVIGATION -->
    <section class="week-navigation">

        <button id="prevWeek">‹</button>

        <div class="week-center">
            <strong id="weekTitle">
                Поточний тиждень
            </strong>

            <span>
                Понеділок — П'ятниця
            </span>
        </div>

        <button id="nextWeek">›</button>

    </section>


    <!-- SCHEDULE -->
    <main>
        <div id="scheduleScreen">

        <section class="schedule-wrapper">

            <div class="table-scroll">

                <table class="schedule">

                    <thead>

                        <tr>
                            <th class="name-column">
                                Працівник
                            </th>

                            <th id="scheduleDay0">Пн</th>

                            <th id="scheduleDay1">Вт</th>

                            <th id="scheduleDay2">Ср</th>

                            <th id="scheduleDay3">Чт</th>

<th id="scheduleDay4">Пт</th>

                            </th>

                            <th id="scheduleDay5">Сб</th>

                            <th id="scheduleDay6">Нд</th>

                            <th class="lunch-column">
                                Обід
                            </th>
                        </tr>

                    </thead>

                    <tbody id="scheduleBody">

                    </tbody>

                </table>

            </div>

        </section>


        <button id="generateScheduleButton" class="add-worker-button">
            ⚙️ Згенерувати розклад
        </button>



        <div id="stationModal" class="station-modal hidden">
            <div class="station-modal-box">
                <div id="stationModalTitle" class="station-modal-title"></div>
                <div id="stationWorkerList" class="station-worker-list"></div>
                <button id="clearStationButton" class="station-clear-button">
                    Звільнити станцію
                </button>
                <button id="cancelStationButton" class="station-cancel-button">
                    Скасувати
                </button>
            </div>
        </div>
        </div>

        <div id="workersScreen" hidden></div>
        <div id="lunchScreen" hidden></div>
    </main>


    <!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
    <button class="active">
        <span>📅</span>
        <small>Розклад</small>
    </button>

    <button>
        <span>👥</span>
        <small>Працівники</small>
    </button>

    <button>
        <span>🍽</span>
        <small>Обіди</small>
    </button>
</nav>


<script src="/static/workers.js?v=2"></script>
<script src="/static/app.js?v=2"></script>

</body>
</html>
