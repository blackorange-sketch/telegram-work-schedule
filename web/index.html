<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Розклад</title>

    <meta name="theme-color" content="#f8f8fa">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="title">Розклад</div>

        <div class="week">
            6 — 10 жовтня 2026
        </div>

    </header>


    <!-- WEEK NAVIGATION -->
    <section class="week-navigation">

        <button id="prevWeek">‹</button>

        <div class="week-center">
            <strong id="weekTitle">
                Поточний тиждень
            </strong>

            <span>
                Понеділок — П'ятниця
            </span>
        </div>

        <button id="nextWeek">›</button>

    </section>


    <!-- SCHEDULE -->
    <main>

        <section class="schedule-wrapper">

            <div class="table-scroll">

                <table class="schedule">

                    <thead>

                        <tr>
                            <th class="name-column">
                                Працівник
                            </th>

                            <th>
                                Пн
                            </th>

                            <th>
                                Вт
                            </th>

                            <th>
                                Ср
                            </th>

                            <th>
                                Чт
                            </th>

                            <th>
                                Пт
                            </th>

                            <th>Сб</th>

                            <th>Нд</th>

                            <th class="lunch-column">
                                Обід
                            </th>
                        </tr>

                    </thead>

                    <tbody id="scheduleBody">

                    </tbody>

                </table>

            </div>

        </section>


        <button id="generateScheduleButton" class="add-worker-button">
            ⚙️ Згенерувати розклад
        </button>



    </main>


    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button class="active">
            <span>📅</span>
            <small>Розклад</small>
        </button>

        <button>
            <span>👥</span>
            <small>Працівники</small>
        </button>

        <button>
            <span>🍽</span>
            <small>Обіди</small>
        </button>

        <button>
            <span>⚙️</span>
            <small>Налаштування</small>
        </button>

    </nav>

</div>


<script src="/static/workers.js?v=2"></script>
<script src="/static/app.js?v=2"></script>

</body>
</html>
